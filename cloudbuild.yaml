substitutions:
  _AR_HOSTNAME: us-central1-docker.pkg.dev
  _AR_PROJECT_ID: semilleros-493300
  _AR_REPOSITORY: teacher-ideal
  _SERVICE_NAME: vektora
  _DEPLOY_REGION: us-central1

steps:
  # 1. Build de la imagen Docker del backend
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '--no-cache'
      - '-t'
      - '$_AR_HOSTNAME/$_AR_PROJECT_ID/$_AR_REPOSITORY/$_SERVICE_NAME:$BUILD_ID'
      - '.'
      - '-f'
      - 'Dockerfile'

  # 2. Push a Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '$_AR_HOSTNAME/$_AR_PROJECT_ID/$_AR_REPOSITORY/$_SERVICE_NAME:$BUILD_ID'

  # 3. Deploy a Cloud Run (Solo actualiza la imagen del servicio gestionado por Terraform)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - '$_SERVICE_NAME'
      - '--image=$_AR_HOSTNAME/$_AR_PROJECT_ID/$_AR_REPOSITORY/$_SERVICE_NAME:$BUILD_ID'
      - '--region=$_DEPLOY_REGION'
      - '--project=$PROJECT_ID'

images:
  - '$_AR_HOSTNAME/$_AR_PROJECT_ID/$_AR_REPOSITORY/$_SERVICE_NAME:$BUILD_ID'

options:
  logging: CLOUD_LOGGING_ONLY
