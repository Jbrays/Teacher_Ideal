# =============================================================================
# Vektora — build & deploy (portable)
# Usa $PROJECT_ID del proyecto de Cloud Build (no hardcodear cuenta/proyecto).
# Sustituciones opcionales permiten renombrar servicio/repo/región sin tocar código.
# =============================================================================

substitutions:
  _AR_REPOSITORY: teacher-ideal
  _SERVICE_NAME: vektora
  _DEPLOY_REGION: us-central1
  # Host de Artifact Registry por región (us-central1-docker.pkg.dev, etc.)
  _AR_HOSTNAME: us-central1-docker.pkg.dev

steps:
  # 1. Build imagen Docker del backend
  - name: 'gcr.io/cloud-builders/docker'
    id: build
    args:
      - 'build'
      - '--no-cache'
      - '-t'
      - '${_AR_HOSTNAME}/$PROJECT_ID/${_AR_REPOSITORY}/${_SERVICE_NAME}:$BUILD_ID'
      - '-t'
      - '${_AR_HOSTNAME}/$PROJECT_ID/${_AR_REPOSITORY}/${_SERVICE_NAME}:latest'
      - '.'
      - '-f'
      - 'Dockerfile'

  # 2. Push tags a Artifact Registry del mismo proyecto
  - name: 'gcr.io/cloud-builders/docker'
    id: push-build-id
    args:
      - 'push'
      - '${_AR_HOSTNAME}/$PROJECT_ID/${_AR_REPOSITORY}/${_SERVICE_NAME}:$BUILD_ID'

  - name: 'gcr.io/cloud-builders/docker'
    id: push-latest
    args:
      - 'push'
      - '${_AR_HOSTNAME}/$PROJECT_ID/${_AR_REPOSITORY}/${_SERVICE_NAME}:latest'

  # 3. Actualizar solo la imagen de Cloud Run (resto de config = Terraform)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: deploy
    entrypoint: gcloud
    args:
      - 'run'
      - 'services'
      - 'update'
      - '${_SERVICE_NAME}'
      - '--image=${_AR_HOSTNAME}/$PROJECT_ID/${_AR_REPOSITORY}/${_SERVICE_NAME}:$BUILD_ID'
      - '--region=${_DEPLOY_REGION}'
      - '--project=$PROJECT_ID'
      - '--quiet'

images:
  - '${_AR_HOSTNAME}/$PROJECT_ID/${_AR_REPOSITORY}/${_SERVICE_NAME}:$BUILD_ID'
  - '${_AR_HOSTNAME}/$PROJECT_ID/${_AR_REPOSITORY}/${_SERVICE_NAME}:latest'

options:
  logging: CLOUD_LOGGING_ONLY
